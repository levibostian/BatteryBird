name: 'Android setup'
description: 'Setup VM for Android'

runs:
  using: "composite"
  steps:
  - name: Set up JDK
    uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
    with:
      distribution: 'temurin'
      java-version: '21'

  - name: Verify gradle scripts are not modified 
    uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

  - name: Setup Android SDK
    uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4 
    
  - name: Setup Gradle and cache dependencies between builds 
    uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3