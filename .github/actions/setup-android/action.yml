name: 'Android setup'
description: 'Setup VM for Android'

runs:
  using: "composite"
  steps:
  - name: Set up JDK
    uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
    with:
      distribution: 'temurin'
      java-version: '25'

  - name: Verify gradle scripts are not modified 
    uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

  - name: Setup Android SDK
    uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4 
    
  - name: Setup Gradle and cache dependencies between builds 
    uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1 # v3