name: Deploy Release 

on:
  push:
    branches: [main]
  # This tool encourages you to run it on pull requests to test the deployment process.
  pull_request:

jobs: 
  make-new-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # If your deploy script that you write needs to push a git commit, git tag, or create a GitHub Release.
      pull-requests: write # If you enable pull request comments (they are enabled by default).
    steps: 
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: ./.github/actions/setup-android

    - name: Create production Android keystore file 
      uses: levibostian/action-random-file@eda8c89e3b3bb5dea0fdb4d3dc8b11876c74d97c # main
      id: create-keystore-file
      with:
        base64-file-content: ${{ secrets.ANDROID_RELEASE_SIGNING_KEY_FILE_BASE64 }}
        file-name: "key"

    # provides the `android-app-bundle` CLI used in the deploy commands below.
    - name: Install codemagic cli 
      run: python -m pip install codemagic-cli-tools            

    - uses: levibostian/decaf@366970ed9e5059c9a9cf3b3237b3f19dfa0369ad # 0.17.3
      env:
        # required to use 'gh' CLI in my step scripts. 
        GH_TOKEN: ${{ github.token }}
        ANDROID_SIGNING_KEY_FILE_PATH: ${{ steps.create-keystore-file.outputs.path }}
        ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_STORE_PASSWORD }}
        ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        get_latest_release_current_branch: decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 get
        get_next_release_version: decaf shebang https://github.com/levibostian/decaf-script-conventional-commits.git/shebang.sh@0.3.1
        deploy: |
          # Build the app before creating the release. Single line because decaf runs each deploy line in its own shell, and gradle reads the version env vars from the process env. Gradle signs with the keystore env vars set on this step; android-app-bundle re-signs the universal APK from the bundle with the same keystore.
          ANDROID_APP_BUILD_NUMBER=$(date +%s) ANDROID_APP_VERSION_NAME="{{nextVersionName}}" ./gradlew bundleRelease
          android-app-bundle build-universal-apk --ks="$ANDROID_SIGNING_KEY_FILE_PATH" --ks-pass=@env:ANDROID_SIGNING_KEY_STORE_PASSWORD --ks-key-alias=upload --key-pass=@env:ANDROID_SIGNING_KEY_PASSWORD
          decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 set-assets "app/build/outputs/bundle/release/app-release-universal.apk#app.apk"
          decaf shebang https://github.com/levibostian/decaf-script-github-releases.git/shebang.sh@1.3.0 set